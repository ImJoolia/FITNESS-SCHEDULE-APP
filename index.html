<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neck & Posture — Aug 28 to Mar 30</title>
<meta name="theme-color" content="#dfe4ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Posture">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ozalid:#dfe4ea; --sheet:#f2f4f6; --ink:#182338; --ink-60:#5c6779;
    --ink-25:#aab2be; --rule:#c3cad4; --redline:#c8102e; --graphite:#8d95a3;
    --anchor:#1d6b52;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ozalid);color:var(--ink);
    font-family:"Barlow",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px 70px}

  header{background:var(--sheet);border-bottom:2px solid var(--ink);
    margin:0 -14px 18px;padding:14px 18px 13px}
  h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:clamp(22px,4.6vw,30px);letter-spacing:.045em;text-transform:uppercase;
    margin:0 0 3px;line-height:1}
  h1 em{font-style:normal;color:var(--redline)}
  .sub{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--ink-60)}

  /* today */
  .today-card{background:#fff;border:2px solid var(--ink);margin-bottom:16px}
  .tc-head{padding:11px 14px 9px;border-bottom:1px solid var(--rule);
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .tc-date{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--redline)}
  .tc-title{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;
    letter-spacing:.05em;text-transform:uppercase}
  .tc-dur{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.09em;color:var(--ink-25)}
  .blk{padding:9px 14px 11px}
  .blk + .blk{border-top:1px solid var(--rule)}
  .blk-lbl{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--anchor);margin-bottom:5px;display:flex;
    align-items:center;gap:6px}
  .blk-lbl:before{content:"";width:7px;height:7px;background:var(--anchor);flex:0 0 auto}
  .blk.bonus .blk-lbl{color:var(--graphite)}
  .blk.bonus .blk-lbl:before{background:none;border:1px solid var(--graphite)}
  .blk-note{font-size:12.5px;color:var(--ink-60);margin:0 0 7px;line-height:1.4}

  ul{list-style:none;margin:0;padding:0}
  label{display:flex;align-items:flex-start;gap:9px;cursor:pointer;padding:5px 2px;
    font-size:14.5px;line-height:1.35}
  label:hover .box{border-color:var(--redline)}
  input{position:absolute;opacity:0;width:0;height:0}
  .box{flex:0 0 16px;height:16px;margin-top:2px;border:1.5px solid var(--ink);
    background:#fff;position:relative;transition:background .12s}
  .blk.bonus .box{border-style:dashed;border-color:var(--graphite)}
  input:focus-visible + .box{outline:2px solid var(--redline);outline-offset:2px}
  input:checked + .box{background:var(--ink);border-color:var(--ink)}
  .box:after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg) scale(0);
    transition:transform .14s ease}
  input:checked + .box:after{transform:rotate(42deg) scale(1)}
  .txt{flex:1}.txt b{font-weight:600}
  .txt span{color:var(--ink-60);font-size:13px}
  input:checked ~ .txt{color:var(--graphite);text-decoration:line-through;
    text-decoration-color:var(--redline);text-decoration-thickness:1.5px}

  .howto{margin:4px 0 0 25px;font-size:12.5px;color:var(--ink-60);line-height:1.45;
    border-left:2px solid var(--rule);padding-left:9px}

  /* count strip */
  .count{background:var(--sheet);border:1px solid var(--ink);padding:11px 14px;
    margin-bottom:16px;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .stat b{font-family:"Barlow Condensed",sans-serif;font-size:26px;font-weight:700;
    line-height:1;display:block}
  .stat span{font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--ink-60)}
  .milestone{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--ink-60);text-align:right;line-height:1.6}
  .milestone b{color:var(--redline)}

  /* weeks */
  h2{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.15em;
    text-transform:uppercase;color:var(--ink-60);margin:22px 0 8px;font-weight:500}
  details{background:var(--sheet);border:1px solid var(--rule);margin-bottom:5px}
  details[open]{border-color:var(--ink)}
  summary{padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:11px;
    list-style:none;font-size:14px}
  summary::-webkit-details-marker{display:none}
  .wk-n{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
    color:var(--ink-60);flex:0 0 58px}
  .wk-rng{font-weight:500}
  .wk-ph{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:8.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--sheet);
    background:var(--graphite);padding:2px 5px}
  .ph2{background:var(--ink-60)} .ph3{background:var(--ink)}
  .wk-body{padding:0 13px 11px;font-size:13.5px;color:var(--ink-60);line-height:1.55}
  .wk-body b{color:var(--ink);font-weight:600}
  .wk-day{display:flex;gap:10px;padding:4px 0;border-top:1px solid var(--rule)}
  .wk-day .d{font-family:"IBM Plex Mono",monospace;font-size:10.5px;flex:0 0 46px;
    color:var(--ink-25);padding-top:2px}

  footer{margin-top:24px;border-top:1px solid var(--ink);padding-top:12px;
    display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--ink-60)}
  .clear{background:none;border:1px solid var(--rule);color:var(--ink-60);cursor:pointer;
    font:inherit;padding:5px 10px}
  .clear:hover{border-color:var(--redline);color:var(--redline)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Neck &amp; Posture — <em>Daily</em></h1>
    <div class="sub">Aug 28 2026 → Mar 30 2027 · checkpoint Oct 14</div>
  </header>

  <div class="count">
    <div class="stat"><b id="days">0</b><span>Days shown up</span></div>
    <div class="stat"><b id="anchors">0</b><span>Neck blocks done</span></div>
    <div class="milestone" id="ms"></div>
  </div>

  <div class="today-card" id="today"></div>

  <h2>The rest of it — open only if you want to</h2>
  <div id="weeks"></div>

  <footer>
    <span>Missing days is expected. The neck block is the only thing that matters.</span>
    <button class="clear" id="clear">Clear all</button>
  </footer>
</div>

<script>
const KEY = "posture:v2:checks";
const START = new Date(2026,7,28), MILE = new Date(2026,9,14), END = new Date(2027,2,30);
const DN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MO = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const P2 = new Date(2026,9,15), P3 = new Date(2027,0,1);
const ph = d => d < P2 ? 0 : d < P3 ? 1 : 2;
const PH = ["P1 Anchor","P2 Build","P3 Strength"];

/* ---- the daily neck block: never skipped, never longer than 4 min ---- */
const ANCHOR = [
  { dur:"3 min", note:"Every day. Desk, couch, car, anywhere. This is the part that actually addresses the neck.",
    items:[
      {n:"Chin tucks", d:"10 × 5 sec hold",
       h:"Sit or stand tall, eyes level. Slide your head straight back — double-chin, not looking down. You should feel it deep in the front of the neck, not in the throat."},
      {n:"Doorway chest stretch", d:"2 × 30 sec",
       h:"Forearm on the door frame at shoulder height, step through until you feel the stretch across the front of the shoulder."}
    ]},
  { dur:"4 min", note:"Every day. Wall angels added — they're the shoulder half of the same problem.",
    items:[
      {n:"Chin tucks", d:"12 × 5 sec hold", h:"Same as before. Add a light hand resistance on the forehead if it's gotten easy."},
      {n:"Wall angels", d:"10 slow reps",
       h:"Back flat to a wall, arms in a goalpost, backs of hands touching. Slide up and down without letting hands or lower back leave the wall."},
      {n:"Doorway chest stretch", d:"2 × 30 sec", h:"Try it at three heights — low, shoulder, high — for 20 sec each."}
    ]},
  { dur:"5 min", note:"Every day. Thoracic extension added — this is the one that targets the upper-back curve directly.",
    items:[
      {n:"Chin tucks", d:"15 × 5 sec hold", h:"Add gentle hand resistance at the forehead."},
      {n:"Thoracic extension over a towel", d:"10 slow reps",
       h:"Roll a towel tight, lie on it across your upper back just below the shoulder blades. Hands behind head, extend back over it. Move the roll up an inch and repeat."},
      {n:"Wall angels", d:"12 slow reps", h:"Slower is harder. Take 4 seconds up, 4 down."},
      {n:"Doorway chest stretch", d:"2 × 30 sec", h:""}
    ]}
];

/* ---- strength days: posture work FIRST, then everything else ---- */
const A = [
  {t:"Posture + Pull", dur:"15 min", items:[
    {n:"Prone Y-T-W", d:"2 × 8 each shape", h:"Face down, arms out in each letter shape, lift just the arms. Thumbs up."},
    {n:"Towel rows", d:"3 × 10", h:"Towel over a door handle, lean back, pull. Squeeze the shoulder blades."},
    {n:"Superman hold", d:"3 × 20 sec", h:""}]},
  {t:"Posture + Pull", dur:"18 min", items:[
    {n:"Prone Y-T-W", d:"3 × 8 each shape", h:""},
    {n:"Table rows", d:"3 × 8", h:"Lie under a sturdy table, grip the edge, pull your chest to it."},
    {n:"Towel rows", d:"3 × 12", h:""},
    {n:"Superman hold", d:"3 × 30 sec", h:""}]},
  {t:"Posture + Pull", dur:"20 min", items:[
    {n:"Prone Y-T-W", d:"3 × 10 each shape, slow", h:""},
    {n:"Table rows", d:"4 × 10", h:""},
    {n:"Towel rows", d:"3 × 15", h:""},
    {n:"Superman hold", d:"3 × 40 sec", h:""}]}
];
const B = [
  {t:"Lower", dur:"15 min", items:[
    {n:"Bodyweight squats", d:"3 × 12", h:""},
    {n:"Reverse lunges", d:"2 × 8 each leg", h:""},
    {n:"Glute bridges", d:"3 × 15", h:""}]},
  {t:"Lower", dur:"18 min", items:[
    {n:"Bodyweight squats", d:"3 × 15", h:""},
    {n:"Reverse lunges", d:"3 × 10 each leg", h:""},
    {n:"Single-leg glute bridge", d:"3 × 10 each", h:""},
    {n:"Wall sit", d:"2 × 45 sec", h:""}]},
  {t:"Lower", dur:"20 min", items:[
    {n:"Slow-tempo squats", d:"4 × 15, 3 sec down", h:""},
    {n:"Bulgarian split squat", d:"3 × 10 each", h:"Back foot on the couch."},
    {n:"Single-leg hip thrust", d:"3 × 12 each", h:"Shoulders on the couch."},
    {n:"Wall sit", d:"3 × 60 sec", h:""}]}
];
const C = [
  {t:"Push + Core", dur:"15 min", items:[
    {n:"Incline pushups", d:"3 × 10", h:"Hands on the kitchen counter."},
    {n:"Dead bugs", d:"3 × 8 each side", h:"Low back stays pressed to the floor."},
    {n:"Side plank", d:"2 × 20 sec each", h:""}]},
  {t:"Push + Core", dur:"18 min", items:[
    {n:"Knee pushups", d:"3 × 10", h:""},
    {n:"Pike pushups", d:"3 × 8", h:""},
    {n:"Dead bugs", d:"3 × 10 each side", h:""},
    {n:"Side plank", d:"3 × 30 sec each", h:""}]},
  {t:"Push + Core", dur:"20 min", items:[
    {n:"Full pushups", d:"4 × 8", h:""},
    {n:"Pike pushups", d:"3 × 10", h:""},
    {n:"Hollow hold", d:"3 × 20 sec", h:""},
    {n:"Side plank", d:"3 × 45 sec each", h:""}]}
];
const CARDIO = [
  {n:"Stair intervals", d:["6 rounds","8 rounds","10 rounds"], h:"Up fast, walk down."},
  {n:"Podcast walk", d:["15 min","20 min","25 min"], h:""},
  {n:"Shadowboxing", d:["5 × 2 min","6 × 2 min","8 × 2 min"], h:""},
  {n:"HIIT circuit", d:["4 rounds","6 rounds","8 rounds"], h:"High knees / jacks / mountain climbers, 30 on 30 off."}
];

function bonusFor(d){
  const w = d.getDay(), p = ph(d);
  if (w===1) return A[p];
  if (w===3) return C[p];
  if (w===5) return B[p];
  if (w===2 || w===4){
    const wk = Math.floor((d - START)/6048e5);
    const c = CARDIO[(wk*2 + (w===4?1:0)) % 4];
    return {t:"Cardio", dur:["15 min","20 min","20 min"][p], items:[{n:c.n, d:c.d[p], h:c.h}]};
  }
  return null;
}

const key = d => `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
let state = {};

function itemHtml(id, it, checked, showHow){
  return `<li><label><input type="checkbox" data-id="${id}"${checked?" checked":""}>
    <span class="box"></span><span class="txt"><b>${it.n}</b> — <span>${it.d}</span></span></label>
    ${showHow && it.h ? `<div class="howto">${it.h}</div>` : ""}</li>`;
}

function renderToday(){
  const t = new Date(); t.setHours(0,0,0,0);
  const d = t < START ? new Date(START) : t > END ? new Date(END) : t;
  const p = ph(d), k = key(d), a = ANCHOR[p], b = bonusFor(d);
  let h = `<div class="tc-head">
      <span class="tc-date">${DN[d.getDay()]} ${MO[d.getMonth()]} ${d.getDate()}</span>
      <span class="tc-title">Today</span></div>
    <div class="blk">
      <div class="blk-lbl">Neck block · ${a.dur} · every day</div>
      <p class="blk-note">${a.note}</p>
      <ul>${a.items.map((it,i)=>itemHtml(`${k}|a${i}`, it, state[`${k}|a${i}`], true)).join("")}</ul>
    </div>`;
  if (b) h += `<div class="blk bonus">
      <div class="blk-lbl">If you have more in you · ${b.t} · ${b.dur}</div>
      <ul>${b.items.map((it,i)=>itemHtml(`${k}|b${i}`, it, state[`${k}|b${i}`], true)).join("")}</ul>
    </div>`;
  else h += `<div class="blk bonus"><div class="blk-lbl">No session scheduled — neck block only</div></div>`;
  document.getElementById("today").innerHTML = h;
}

function renderWeeks(){
  let h = "", d = new Date(START), wk = 0;
  const today = new Date(); today.setHours(0,0,0,0);
  while (d <= END){
    const ws = new Date(d);
    let we = new Date(d); we.setDate(we.getDate() + (7 - (we.getDay()===0?7:we.getDay())));
    if (we > END) we = new Date(END);
    wk++;
    const p = ph(ws), isNow = today >= ws && today <= we;
    let rows = "", c = new Date(ws);
    while (c <= we){
      const b = bonusFor(c);
      rows += `<div class="wk-day"><span class="d">${DN[c.getDay()]}</span>
        <span>${b ? `<b>${b.t}</b> · ${b.dur}` : "neck block only"}</span></div>`;
      c.setDate(c.getDate()+1);
    }
    h += `<details${isNow?" open":""}><summary>
        <span class="wk-n">WK ${String(wk).padStart(2,"0")}</span>
        <span class="wk-rng">${MO[ws.getMonth()]} ${ws.getDate()} – ${MO[we.getMonth()]} ${we.getDate()}</span>
        <span class="wk-ph ph${p+1}">${PH[p]}</span></summary>
      <div class="wk-body"><b>Neck block every day (${ANCHOR[p].dur}).</b> Sessions below are optional.
        ${rows}</div></details>`;
    d = new Date(we); d.setDate(d.getDate()+1);
  }
  document.getElementById("weeks").innerHTML = h;
}

function tally(){
  const ks = Object.keys(state);
  const days = new Set(ks.map(x=>x.split("|")[0])).size;
  const anchorDays = new Set(ks.filter(x=>x.split("|")[1][0]==="a").map(x=>x.split("|")[0])).size;
  document.getElementById("days").textContent = days;
  document.getElementById("anchors").textContent = anchorDays;
  const t = new Date(); t.setHours(0,0,0,0);
  const left = Math.max(0, Math.round((MILE - t)/864e5));
  document.getElementById("ms").innerHTML = left
    ? `<b>${left} days</b><br>to Oct 14 checkpoint`
    : `Checkpoint passed<br>keep going to Mar 30`;
}

let timer;
function save(){
  clearTimeout(timer);
  timer = setTimeout(()=>{
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ console.error("Could not save:", e); }
  }, 250);
}

document.addEventListener("change", e=>{
  const cb = e.target.closest("input[type=checkbox]");
  if (!cb) return;
  if (cb.checked) state[cb.dataset.id] = 1; else delete state[cb.dataset.id];
  tally(); save();
});
document.getElementById("clear").addEventListener("click", ()=>{
  if (!confirm("Clear every check?")) return;
  state = {}; renderToday(); tally(); save();
});

try { const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch(e){ state = {}; }
renderToday(); renderWeeks(); tally();
</script>
